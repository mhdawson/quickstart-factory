run-skill-command: Add nightly testing to qs-test-quickstart.
execution:
  network: required
  external-dependencies:
    - https://github.com/rh-ai-quickstart/quickstart-ci-testing
question-answer-context: |
  Use helm-do-something as the undeploy target for this fixture.
validation-options:
  mode: targeted
  additional-instructions: |
    Validate that the skill asks the user for the missing undeploy target,
    accepts helm-do-something as the answer, and uses that exact command in
    the generated reusable nightly workflow and manifest. Do not require
    unrelated output files to match the baseline.
